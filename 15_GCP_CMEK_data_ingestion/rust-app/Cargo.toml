[package]
name = "cmek-poc-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }

# Data serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1.0"

# Environment variables
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true 